name: Release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run test:compat
      - name: Verify release version
        run: node -e 'if(require("./manifest.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
